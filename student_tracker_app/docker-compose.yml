services:
  db:
    image: mysql:8.0
    container_name: student_tracker_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme_mysql_password # Placeholder, user should change
      MYSQL_DATABASE: student_tracker
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306" # Expose MySQL port for direct access if needed

  backend:
    build: ./backend
    container_name: student_tracker_backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root 
      MYSQL_PASSWORD: changeme_mysql_password # Placeholder, user should change
      MYSQL_DATABASE: student_tracker
    ports:
      - "5000:5000" # Backend service directly accessible on host port 5000 for dev/debug
    depends_on:
      - db
    volumes:
      - ./backend:/app # For development live reload

  frontend:
    image: nginx:latest
    container_name: student_tracker_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Access frontend via http://localhost:8080
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  mysql_data:
