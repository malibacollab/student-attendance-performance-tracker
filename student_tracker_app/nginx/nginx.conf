server {
    listen 80;
    server_name localhost;

    # Serve static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # For single-page applications, though not strictly necessary for current multi-page HTML setup
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:5000/; # Trailing slash is important here
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Deny access to .htaccess files, if any
    location ~ /\.ht {
        deny all;
    }
}
