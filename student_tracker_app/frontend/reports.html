<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Student Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (optional, if you create a css/style.css) -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <a class="navbar-brand" href="index.html">Student Tracker</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="students.html">Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="subjects.html">Subjects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="teachers.html">Teachers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="enrollments.html">Enrollments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="attendance.html">Attendance</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="grades.html">Grades</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="reports.html">Reports <span class="sr-only">(current)</span></a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>View Reports</h1>
        </div>

        <div id="alertPlaceholder"></div>

        <!-- Subject Average Grade Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Subject Average Grade</h5>
                <div class="form-group">
                    <label for="reportSubjectSelectAvgGrade">Select Subject:</label>
                    <select id="reportSubjectSelectAvgGrade" class="form-control">
                        <option value="">Loading Subjects...</option>
                    </select>
                </div>
                <button id="getSubjectAvgGradeBtn" class="btn btn-info mt-2">Get Average Grade</button>
                <div id="subjectAvgGradeResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Student Overall Average Grade Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Student Overall Average Grade</h5>
                <div class="form-group">
                    <label for="reportStudentSelectAvgGrade">Select Student:</label>
                    <select id="reportStudentSelectAvgGrade" class="form-control">
                        <option value="">Loading Students...</option>
                    </select>
                </div>
                <button id="getStudentAvgGradeBtn" class="btn btn-info mt-2">Get Average Grade</button>
                <div id="studentAvgGradeResult" class="mt-2"></div>
            </div>
        </div>

        <!-- Low Attendance Alert Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Low Attendance Report</h5>
                <div class="form-group">
                    <label for="reportSubjectSelectLowAttendance">Select Subject:</label>
                    <select id="reportSubjectSelectLowAttendance" class="form-control">
                        <option value="">Loading Subjects...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="attendanceThreshold">Attendance Threshold (%):</label>
                    <input type="number" id="attendanceThreshold" class="form-control" value="70" min="0" max="100">
                </div>
                <button id="getLowAttendanceBtn" class="btn btn-warning mt-2">Get Low Attendance Report</button>
                <div id="lowAttendanceResultArea" class="mt-2"> <!-- Container for table or message -->
                    <table class="table table-sm table-striped table-hover mt-2 d-none" id="lowAttendanceTable">
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Student Name</th>
                                <th>Attendance Rate</th>
                                <th>Present Days</th>
                                <th>Total Days</th>
                            </tr>
                        </thead>
                        <tbody id="lowAttendanceTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery, Popper.js, and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
    <!-- Page-specific JS -->
    <script src="js/reports.js"></script> 
</body>
</html>
