<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollments | Student Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (optional, if you create a css/style.css) -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <a class="navbar-brand" href="index.html">Student Tracker</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="students.html">Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="subjects.html">Subjects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="teachers.html">Teachers</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="enrollments.html">Enrollments <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="attendance.html">Attendance</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="grades.html">Grades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="reports.html">Reports</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Manage Enrollments</h1>
        </div>

        <div id="alertPlaceholder"></div>

        <!-- Create Enrollment Form -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Create New Enrollment</h5>
                <form id="createEnrollmentForm">
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="studentSelect">Student</label>
                            <select id="studentSelect" class="form-control" required>
                                <option value="">Loading Students...</option>
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="subjectSelect">Subject</label>
                            <select id="subjectSelect" class="form-control" required>
                                <option value="">Loading Subjects...</option>
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="teacherSelect">Teacher</label>
                            <select id="teacherSelect" class="form-control" required>
                                <option value="">Loading Teachers...</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Enroll Student</button>
                </form>
            </div>
        </div>

        <!-- Table to Display Enrollments -->
        <h2 class="mt-4">Current Enrollments</h2>
        <table class="table table-striped table-hover mt-2">
            <thead>
                <tr>
                    <th>Enrollment ID</th>
                    <th>Student Name</th>
                    <th>Subject Name</th>
                    <th>Teacher Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="enrollmentsTableBody">
                <!-- Enrollment rows will be inserted here by JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- jQuery, Popper.js, and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
    <!-- Page-specific JS -->
    <script src="js/enrollments.js"></script> 
</body>
</html>
