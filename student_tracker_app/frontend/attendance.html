<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Student Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (optional, if you create a css/style.css) -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <a class="navbar-brand" href="index.html">Student Tracker</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="students.html">Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="subjects.html">Subjects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="teachers.html">Teachers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="enrollments.html">Enrollments</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="attendance.html">Attendance <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="grades.html">Grades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="reports.html">Reports</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Manage Attendance</h1>
        </div>

        <div id="alertPlaceholder"></div>

        <!-- Enrollment Selector -->
        <div class="form-group">
            <label for="enrollmentSelectAttendance">Select Enrollment:</label>
            <select id="enrollmentSelectAttendance" class="form-control mb-3">
                <option value="">Select an Enrollment...</option>
                <!-- Options will be populated by JavaScript -->
            </select>
        </div>

        <!-- Record Attendance Form (Initially Hidden) -->
        <div id="recordAttendanceFormContainer" style="display: none;">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Record New Attendance</h5>
                    <form id="recordAttendanceForm">
                        <input type="hidden" id="currentEnrollmentId">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="attendanceDate">Date</label>
                                <input type="date" id="attendanceDate" class="form-control" required>
                            </div>
                            <div class="form-group col-md-6">
                                <label for="attendanceStatus">Status</label>
                                <select id="attendanceStatus" class="form-control" required>
                                    <option value="present">Present</option>
                                    <option value="absent">Absent</option>
                                    <option value="late">Late</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Record Attendance</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Attendance Table Display (Initially Hidden) -->
        <div id="attendanceTableContainer" style="display: none;">
            <h2 class="mt-4">Attendance Records</h2>
            <table class="table table-striped table-hover mt-2">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Status</th>
                        <!-- Actions column can be added later -->
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <!-- Attendance rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- jQuery, Popper.js, and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
    <!-- Page-specific JS -->
    <script src="js/attendance.js"></script> 
</body>
</html>
